[package]
name = "observer"
version = "0.1.0"
description = "Preview as many file types as possible"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "observer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tiny_http = { version = "0.12" }
# M2 图片解码(design.md §5⑤,method.md §5):image crate 覆盖 tiff/tga/exr/dds/qoi/hdr;
# psd crate 取 PSD/PSB 合成图。default-features=false 只启所需格式,png 用于统一编码输出。
image = { version = "0.25", default-features = false, features = ["png", "tiff", "tga", "exr", "dds", "qoi", "hdr"] }
psd = "0.3"
# M2 RAW 解码(method.md §5):rawler 纯 Rust(dnglab),覆盖 cr2/cr3/nef/arw/orf/rw2/dng/raf 等。
rawler = "0.7"
# M3 MIDI 合成(method.md §4):rustysynth 纯 Rust SoundFont 合成 → PCM;hound 写 WAV(纯 Rust)。
rustysynth = "1.3"
hound = "3.5"
heic = "0.1"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
